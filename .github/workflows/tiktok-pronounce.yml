# Name pronunciations from the leagues' own guides (owner OK 11/27 22:2x): the NBA's official guide PDF and
# Pro-Football-Reference's NFL guide (from NFL and team media guides) -> tiktok/pronounce.json, so the Drill voice reads
# names the way they're said. Runs here because nba.com and PFR can't be reached from the Claude workspace.
# Mondays before the props run, on Run workflow, and when the puller itself changes. A source that fails keeps its last copy.
name: TikTok pronounce
on:
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tiktok/pronounce.py
      - .github/workflows/tiktok-pronounce.yml
permissions:
  contents: write
concurrency:
  group: tiktok-pronounce
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tiktok
      - name: Install pdftotext
        run: command -v pdftotext || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null; }
      - name: Fetch the guides
        timeout-minutes: 4
        run: python -u tiktok/pronounce.py fetch
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok/pronounce.json
          git commit -qm "TikTok pronounce guides [skip ci]" || { echo "nothing new"; exit 0; }
          for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i * 10)); done
          exit 1
