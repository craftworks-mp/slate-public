# 2-Minute Drill TikTok episode audio in Nick's locked voice (tiktok/voice.py, tiktok/drill/). Manual for now:
# Actions > TikTok Drill > Run workflow. The daily input from slate-data and the video come with the video maker.
# Runs here because this repo is public (free minutes). Nick's voice stays encrypted in the repo; Claude decrypts it for him.
name: TikTok Drill
run-name: TikTok Drill${{ inputs.temperature && format(' t{0}', inputs.temperature) || '' }}${{ inputs.ref_speed && format(' s{0}', inputs.ref_speed) || '' }}${{ inputs.video_from && format(' video {0}', inputs.video_from) || '' }}
on:
  workflow_dispatch:
    inputs:
      input:
        description: 'Episode input JSON (2 questions from a past day''s pool)'
        default: 'tiktok/drill/input/sample.json'
      last:
        description: 'Last Drill answer JSON (- = the very first episode)'
        default: 'tiktok/drill/input/sample-last.json'
      temperature:
        description: 'Voice sampling temperature (blank = model default; accent A/B 11/22)'
        default: ''
      ref_speed:
        description: 'Speed up the voice reference before cloning, pitch kept (blank = as recorded; 1.06 = +6%; pace A/B 11/22)'
        default: ''
      video_from:
        description: 'Video only: a tiktok/drill/out folder name to re-cut with no new voice (blank = render a new episode + its video)'
        default: ''
permissions:
  contents: write
concurrency:
  group: tiktok-drill-${{ inputs.temperature || 'default' }}-${{ inputs.ref_speed || '1' }}
  cancel-in-progress: false
jobs:
  voice:
    if: ${{ inputs.video_from == '' }}
    # Three jobs side by side, each loading the voice and rendering about a third of the clips (balanced by words), so an
    # ear round lands in ~7 min instead of ~18 and a stuck sentence shows in one job (card 20261122-tb-drill-parallel-render).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        part: [0, 1, 2]
    env:
      IN: ${{ inputs.input }}
      LAST: ${{ inputs.last }}
      VOICE_TEMP: ${{ inputs.temperature }}
      REF_SPEED: ${{ inputs.ref_speed }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tiktok
      - name: Decrypt the voice reference (first, so a missing secret fails in seconds)
        env:
          KEY: ${{ secrets.VOICE_REF_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "VOICE_REF_KEY secret is missing"; exit 1; }
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$KEY" -o tiktok/nick_ref.wav -d tiktok/nick_ref.wav.gpg
          ls -la tiktok/nick_ref.wav
      - name: Speed up the reference (tempo only, pitch kept; the clone re-voices it, so the output's speed is never touched)
        if: inputs.ref_speed != ''
        run: |
          [[ "$REF_SPEED" =~ ^1\.[0-9]{1,2}$ ]] || { echo "ref_speed must look like 1.06"; exit 1; }
          sudo apt-get install -y -qq rubberband-cli >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq rubberband-cli >/dev/null; }
          rubberband -q --fine -T "$REF_SPEED" tiktok/nick_ref.wav ref_fast.wav || rubberband -q -c 6 -T "$REF_SPEED" tiktok/nick_ref.wav ref_fast.wav
          mv ref_fast.wav tiktok/nick_ref.wav
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Script checks (numbers, names, bet words, clock order)
        if: matrix.part == 0
        run: python -u tiktok/drill/test_episode.py
      - name: Install (pinned to the set that rendered the 11/22 mock, run 45065579888)
        run: |
          CPU=https://download.pytorch.org/whl/cpu
          pip install -q torch==2.15.0 torchaudio==2.11.1 --index-url $CPU
          pip install -q --extra-index-url $CPU qwen-tts==0.1.1 transformers==4.57.3 accelerate==1.12.0 numpy==2.4.6 soundfile
          pip freeze | grep -i -E '^(torch|torchaudio|transformers|accelerate|qwen-tts|qwen_tts|numpy)==' | tee versions.txt
      - name: Render share ${{ matrix.part }} of 3
        run: python -u tiktok/drill/render.py "$IN" "$LAST" out --part ${{ matrix.part }}/3 clips
      - name: Encrypt the clips (public repo, and anyone signed in can download artifacts)
        if: always()
        env:
          KEY: ${{ secrets.VOICE_REF_KEY }}
        run: |
          rm -f tiktok/nick_ref.wav
          [ -d clips ] || exit 0
          cp versions.txt clips/ 2>/dev/null || true
          tar -cf clips.tar clips
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$KEY" --symmetric --cipher-algo AES256 -o clips-${{ matrix.part }}.tar.gpg clips.tar
          rm -rf clips clips.tar
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.part }}
          path: clips-${{ matrix.part }}.tar.gpg
          retention-days: 1
          if-no-files-found: error
  stitch:
    # Builds episode.wav + cues.json from the three shares exactly as one job would (no voice model), then the words check.
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dir: ${{ steps.commit.outputs.dir }}
    env:
      IN: ${{ inputs.input }}
      LAST: ${{ inputs.last }}
      VOICE_TEMP: ${{ inputs.temperature }}
      REF_SPEED: ${{ inputs.ref_speed }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tiktok
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (no voice model needed here)
        run: pip install -q numpy==2.4.6 soundfile faster-whisper==1.2.1
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          merge-multiple: true
          path: enc
      - name: Decrypt the clips
        env:
          KEY: ${{ secrets.VOICE_REF_KEY }}
        run: |
          for g in enc/clips-*.tar.gpg; do gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$KEY" -o x.tar -d "$g" && tar -xf x.tar && rm x.tar; done
          cp clips/versions.txt . ; ls clips | wc -l
      - name: Stitch
        run: python -u tiktok/drill/render.py "$IN" "$LAST" out --clips clips
      - name: Check words (speech to text)
        run: python -u tiktok/drill/check.py out
      - name: Encrypt owner audio (this repo is public)
        if: always()
        env:
          KEY: ${{ secrets.VOICE_REF_KEY }}
        run: |
          rm -rf clips enc
          [ -e out/episode.wav ] || exit 0
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$KEY" --symmetric --cipher-algo AES256 -o out/episode.wav.gpg out/episode.wav
          rm -f out/episode.wav
      - name: Commit
        id: commit
        if: always()
        run: |
          [ -e out/episode.wav.gpg ] || { echo "nothing rendered"; exit 1; }
          D="tiktok/drill/out/$(TZ=America/New_York date +%Y-%m-%d)-${{ github.run_id }}${VOICE_TEMP:+-t$VOICE_TEMP}${REF_SPEED:+-s$REF_SPEED}"
          mkdir -p "$D"
          cp out/episode.wav.gpg versions.txt "$D"/
          cp out/cues.json out/transcript.json "$D"/ 2>/dev/null || true
          cp "$IN" "$D/input.json"  # the video job (and any later re-cut) reads the same questions
          if [ "$LAST" = "-" ]; then echo null > "$D/last.json"; else cp "$LAST" "$D/last.json"; fi
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          ls -la "$D"
          ! git status --porcelain | grep -E '\.wav$' || { echo "plain wav in the tree"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D"
          git commit -qm "TikTok Drill audio [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i * 10)); done
          exit 1

  video:
    # The video (owner OK 11/22 18:5x): frames from tiktok/video/make.py over the episode's audio + the CC0 music bed.
    # Runs after a fresh render, or alone with video_from = an out folder name (re-cut a past run, no re-voicing).
    needs: stitch
    if: ${{ !cancelled() && (needs.stitch.result == 'success' || (inputs.video_from != '' && needs.stitch.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IN: ${{ inputs.input }}
      LAST: ${{ inputs.last }}
      D: ${{ inputs.video_from != '' && format('tiktok/drill/out/{0}', inputs.video_from) || needs.stitch.outputs.dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: tiktok
      - name: Decrypt the episode audio (first, so a missing secret or folder fails in seconds)
        env:
          KEY: ${{ secrets.VOICE_REF_KEY }}
        run: |
          [ -e "$D/episode.wav.gpg" ] || { echo "no $D/episode.wav.gpg"; exit 1; }
          mkdir -p "$RUNNER_TEMP/v"
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$KEY" -o "$RUNNER_TEMP/v/episode.wav" -d "$D/episode.wav.gpg"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install (Chromium for the frames, ffmpeg for the encode)
        run: |
          pip install -q numpy==2.4.6 soundfile pillow playwright==1.63.0
          python -m playwright install --with-deps chromium > /dev/null
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
      - name: Video checks (letters, screen text, timing)
        run: python tiktok/video/test_video.py
      - name: Music (CC0 tracks from OpenGameArt, checked again at fetch)
        run: |
          python tiktok/video/music.py fetch tiktok/video/music.json "$RUNNER_TEMP/music"
          [ -e "$RUNNER_TEMP/music/music.json" ] && echo "MUSIC=--music $RUNNER_TEMP/music/music.json" >> "$GITHUB_ENV" || true
      - name: Render
        timeout-minutes: 14
        run: |
          I="$IN"; L="$LAST"
          [ -e "$D/input.json" ] && I="$D/input.json"
          [ -e "$D/last.json" ] && L="$D/last.json"
          python -u tiktok/video/make.py "$D" "$I" "$L" --audio "$RUNNER_TEMP/v/episode.wav" $MUSIC --out "$RUNNER_TEMP/v/episode.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "$RUNNER_TEMP/v/episode.mp4"
      - name: Encrypt the video (his voice is in it; this repo is public)
        env:
          KEY: ${{ secrets.VOICE_REF_KEY }}
        run: |
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$KEY" --symmetric --cipher-algo AES256 -o "$D/episode.mp4.gpg" "$RUNNER_TEMP/v/episode.mp4"
          rm -rf "$RUNNER_TEMP/v" "$D/stills"
      - name: Commit
        run: |
          ! git status --porcelain --untracked-files=all | grep -E '\.(wav|mp4)$' || { echo "plain audio or video in the tree"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D/episode.mp4.gpg" "$D/video-plan.json"
          git commit -qm "TikTok Drill video [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i * 10)); done
          exit 1
