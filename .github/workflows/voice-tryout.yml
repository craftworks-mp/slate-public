name: Voice tryout
# TikTok shorts narrator tryout (slate-data blueprint 11/21 20:27, step 1): renders narrator samples on CPU and commits
# loudness-matched MP3s to tiktok/tryout/out/ (designed-voice references to tiktok/tryout/refs/). Kokoro renders in
# Claude's workspace. Manual only (Actions > Voice tryout > Run workflow) with any engine list, e.g. ["qwen-nick"],
# so a script change never re-designs (and overwrites) voices already picked from.
on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'JSON list: chatterbox, turbo, c1, orpheus-leo, orpheus-dan, orpheus-zac, qwen, magpie, qwen-d1..qwen-d4, chatterbox-nick, turbo-nick, qwen-nick'
        default: '["magpie","qwen-d1","qwen-d2","qwen-d3","qwen-d4"]'
permissions:
  contents: write
concurrency:
  group: voice-tryout
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(inputs.engines || '["magpie","qwen-d1","qwen-d2","qwen-d3","qwen-d4"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tiktok/tryout
      - name: Decrypt owner references (first, so a missing secret fails in seconds)
        if: endsWith(matrix.engine, '-nick')
        env:
          KEY: ${{ secrets.VOICE_REF_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "VOICE_REF_KEY secret is missing"; exit 1; }
          for g in tiktok/tryout/nick_ref*.wav.gpg; do
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$KEY" -o "${g%.gpg}" -d "$g"
          done
          ls tiktok/tryout/nick_ref*.wav
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.engine == 'magpie' && '3.12' || '3.11' }}  # NeMo main needs 3.12+
      - name: Install (CPU torch)
        run: |
          CPU=https://download.pytorch.org/whl/cpu
          case "${{ matrix.engine }}" in
            chatterbox|turbo|c1|chatterbox-nick|turbo-nick)
              pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url $CPU
              pip install -q chatterbox-tts==0.1.7 soundfile ;;
            magpie)
              pip install -q torch torchaudio --index-url $CPU
              pip install -q --extra-index-url $CPU "nemo_toolkit[tts] @ git+https://github.com/NVIDIA/NeMo.git@main" kaldialign peft soundfile ;;
            orpheus-*)
              pip install -q torch --index-url $CPU
              pip install -q llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
              pip install -q snac soundfile huggingface_hub ;;
            qwen*)
              pip install -q torch torchaudio --index-url $CPU
              pip install -q --extra-index-url $CPU qwen-tts==0.1.1 soundfile ;;
          esac
      - name: Render
        run: python -u tiktok/tryout/render.py ${{ matrix.engine }} out
      - name: Check words (speech to text)
        if: matrix.engine == 'c1' || startsWith(matrix.engine, 'orpheus') || endsWith(matrix.engine, '-nick')
        run: |
          pip install -q faster-whisper
          P="${{ matrix.engine }}"; [ "$P" = qwen-nick ] && P=qwen17-nick  # qwen saves as qwen17-<voice>
          python -u tiktok/tryout/check.py out "$P"
      - name: Encrypt owner clips (this repo is public; Claude decrypts them for Nick)
        if: endsWith(matrix.engine, '-nick')
        env:
          KEY: ${{ secrets.VOICE_REF_KEY }}
        run: |
          for f in out/*.wav; do
            [ -e "$f" ] || continue
            gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$KEY" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"
            rm -f "$f"
          done
          ls -la out
      - name: Remove owner reference
        if: always()
        run: rm -f tiktok/tryout/nick_ref*.wav
      - uses: actions/upload-artifact@v4
        with:
          name: voices-${{ matrix.engine }}
          path: out/
  publish:
    needs: render
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tiktok/tryout
      - uses: actions/download-artifact@v4
        with:
          path: raw
          pattern: voices-*
          merge-multiple: true
      - name: MP3s + commit
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          mkdir -p tiktok/tryout/out tiktok/tryout/refs
          for f in raw/*.wav; do
            [ -e "$f" ] || continue
            ffmpeg -y -loglevel error -i "$f" -af loudnorm=I=-16:TP=-1.5:LRA=11 -ar 44100 -ac 1 -b:a 96k \
              "tiktok/tryout/out/$(basename "${f%.wav}").mp3"
          done
          cp raw/*.json tiktok/tryout/out/ 2>/dev/null || true
          cp raw/*.wav.gpg tiktok/tryout/out/ 2>/dev/null || true  # owner clips stay encrypted
          cp raw/refs/*.wav tiktok/tryout/refs/ 2>/dev/null || true
          rm -f tiktok/tryout/nick_ref*.wav
          ls -la tiktok/tryout/out tiktok/tryout/refs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok/tryout/out tiktok/tryout/refs
          git commit -qm "Voice tryout samples [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((i * 10)); done
          exit 1
